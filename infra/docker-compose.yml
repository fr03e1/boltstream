version: "3.8"
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports: [ "9092:9092", "9644:9644" ]
    volumes:
      - ../docker-data/redpanda:/var/lib/redpanda/data

  prometheus:
    image: prom/prometheus:latest
    container_name: bolt_prometheus
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: bolt_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: bolt_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: bolt
      POSTGRES_PASSWORD: bolt
      POSTGRES_DB: boltstream
    ports:
      - "5432:5432"
    volumes:
      - ../docker-data/pg_data:/var/lib/postgresql/data