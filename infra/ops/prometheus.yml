global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "boltstream-producer"
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "boltstream-consumer"
    static_configs:
      - targets: ["host.docker.internal:8082"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']